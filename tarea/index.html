<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarea - Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 30px auto; }
    li { margin-bottom: 8px; }
    .hecha { text-decoration: line-through; color: #888; }
    .error { color: #c0392b; }
    .ok { color: #1e8449; }
  </style>
</head>
<body>
  <h1 id="titulo">Mi lista de tareas</h1>

  <form id="formTarea">
    <input id="nuevaTarea" type="text" placeholder="Escribe una tarea">
    <span id="contadorCaracteres">0</span>/40
    <button type="submit">Agregar</button>
  </form>
  <p id="mensaje"></p>

  <ul id="lista"></ul>
  <p id="resumen"></p>

  <script src="app.js"></script>
</body>
</html>
